name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore projects
        run: dotnet restore NutriFlow.sln --locked-mode --warnaserror

      - name: Set up Node.js for frontend checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify frontend
        run: |
          node --check NutriFlow.Api/wwwroot/js/app.js
          for module in web/NutriFlow.Web/wwwroot/js/*.mjs scripts/prepare-web-deploy.mjs scripts/serve-web.mjs; do
            node --check "$module"
          done
          node --test scripts/tests/*.test.mjs

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build Release
        run: dotnet build NutriFlow.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test NutriFlow.sln --configuration Release --no-build --no-restore

      - name: Verify offline mobile core
        run: |
          dotnet restore mobile/NutriFlow.Mobile.Core.slnx --locked-mode --warnaserror
          dotnet test mobile/NutriFlow.Mobile.Core.slnx --configuration Release --no-restore --warnaserror
          dotnet format mobile/NutriFlow.Mobile.Core.slnx --no-restore --verify-no-changes

      - name: Verify standalone meal workflow
        shell: pwsh
        run: ./scripts/Test-MealWorkflow.ps1

      - name: Verify publish contents
        shell: pwsh
        run: ./scripts/Test-Publish.ps1

      - name: Verify formatting
        run: dotnet format NutriFlow.sln --no-restore --verify-no-changes

      - name: Check EF Core model
        env:
          Ai__Provider: Fake
          Demo__SeedData: 'false'
          Database__ApplyMigrationsOnStartup: 'false'
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project NutriFlow.Infrastructure/NutriFlow.Infrastructure.csproj
          --startup-project NutriFlow.Api/NutriFlow.Api.csproj
          --configuration Release
          --no-build

      - name: Audit vulnerable packages
        run: dotnet list NutriFlow.sln package --include-transitive --vulnerable --no-restore

      - name: Build Docker image
        run: docker build --pull --tag nutriflow:ci .

      # the web lock file pins packages that follow the sdk (ILLink.Tasks, WebAssembly.Pack); workload manifests that
      # the runner image installed for a newer sdk would raise WebAssembly.Pack, so this sdk goes to a clean folder.
      # these steps rewrite global.json, so they stay after everything that reads it, the docker build included
      - name: Set up .NET SDK for the web app
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-web
        with:
          dotnet-version: '10.0.401'

      - name: Select exact SDK for the web app
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("global.json", "utf8"));
            config.sdk.version = "10.0.401";
            config.sdk.rollForward = "disable";
            writeFileSync("global.json", JSON.stringify(config, null, 2) + "\n");
          '
          test "$(dotnet --version)" = '10.0.401'

      - name: Verify web app
        run: |
          dotnet restore web/NutriFlow.Web.slnx --locked-mode --warnaserror
          dotnet test web/NutriFlow.Web.slnx --configuration Release --no-restore --warnaserror
          dotnet format web/NutriFlow.Web.slnx --no-restore --verify-no-changes
          dotnet list web/NutriFlow.Web.slnx package --include-transitive --vulnerable --no-restore
